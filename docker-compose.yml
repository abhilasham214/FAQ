# Ports are configurable (see .env.example) in case 3000 / 8000 are already taken.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faq
      POSTGRES_PASSWORD: faq
      POSTGRES_DB: faq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faq -d faq"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://faq:faq@db:5432/faq
      CACHE_DIR: /cache
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - cache:/cache # embedding + LLM response caches
      - models:/models # downloaded sentence-transformers weights
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  cache:
  models:
